# TEMPLATE: copy to .github/workflows/oddgrid-schema-export.yml in a SEPARATELY
# APPROVED PRIVATE UTILITY repository's default branch. Never activate on storefront main.
name: OddGrid source schema export only
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed 40-character integration branch commit containing cloud preparation
        required: true
        type: string
      schemas:
        description: Reviewed user-managed schema list
        default: public,private
        required: true
        type: string
      approval:
        description: After separate approval, enter export-schema-only:izixhjstwfgywbgrnrey
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oddgrid-source-schema-export
  cancel-in-progress: false
jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.private == true &&
      github.repository == vars.EXPORT_RUNNER_REPOSITORY &&
      github.repository != 'kehiloekpro-lgtm/oddgrid-power-flight'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate manual inputs without credentials
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          APPROVAL: ${{ inputs.approval }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL" == 'export-schema-only:izixhjstwfgywbgrnrey' ]]
      - name: Checkout reviewed source, without persisting a token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kehiloekpro-lgtm/oddgrid-power-flight
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source branch and runner tools without credentials
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]]
          git fetch --no-tags origin integration/supabase-demo-product
          git merge-base --is-ancestor HEAD FETCH_HEAD
          command -v python3
          command -v psql
          command -v docker
          docker info >/dev/null
          python3 -m unittest discover -s backend/checkout-prepare/development/tests -q
      - name: Install checksum-pinned CLI on ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oddgrid-cli"
          curl --fail --silent --show-error --location \
            'https://github.com/supabase/cli/releases/download/v2.121.0/supabase_2.121.0_linux_amd64.tar.gz' \
            --output "$RUNNER_TEMP/oddgrid-cli/cli.tar.gz"
          cd "$RUNNER_TEMP/oddgrid-cli"
          echo '4b481189efbdc57cf2d37bdee5f1a0d29574314398564b32a6dfb76c0fcf275f  cli.tar.gz' | sha256sum --check --status
          tar -xzf cli.tar.gz supabase
          [[ "$(./supabase --version)" == '2.121.0' ]]
          ./supabase db dump --help >/dev/null
          ./supabase link --help >/dev/null
          echo "$RUNNER_TEMP/oddgrid-cli" >> "$GITHUB_PATH"
      - name: Read source schema only using existing export procedure
        env:
          EXPORT_RUNNER_REPOSITORY: ${{ vars.EXPORT_RUNNER_REPOSITORY }}
          SOURCE_DATABASE_URL: ${{ vars.ODDGRID_SOURCE_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.ODDGRID_SOURCE_READ_TOKEN }}
          ODDGRID_SOURCE_DB_PASSWORD: ${{ secrets.ODDGRID_SOURCE_DB_PASSWORD }}
        shell: bash
        run: python3 backend/checkout-prepare/development/cloud/run_export.py
      - name: Preserve private schema-only bundle for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oddgrid-schema-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oddgrid-schema-private/schema.sql
            ${{ runner.temp }}/oddgrid-schema-private/managed-schema-attachments.sql
            ${{ runner.temp }}/oddgrid-schema-private/manifest.json
            ${{ runner.temp }}/oddgrid-schema-private/cloud-provenance.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary database exports and CLI context
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/oddgrid-schema-private" "$RUNNER_TEMP/oddgrid-cli"
