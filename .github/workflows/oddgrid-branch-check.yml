name: OddGrid integration branch checks
on:
  push:
    branches:
      - integration/supabase-demo-product
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build without production deployment
        run: npm run build
